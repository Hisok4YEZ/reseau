<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Mif05 Réseaux — révisions</title>
  <meta name="description" content="Cours résumé, vidéos, diapos et QCM pour l'UE Mif05 Réseaux (Lyon 1).">
  <meta name="theme-color" content="#f5f4f0" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#111317" media="(prefers-color-scheme: dark)">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Réseaux">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="assets/style.css">
  <script>
    /* applique le thème choisi avant l'affichage (évite le flash) */
    try { var t = localStorage.getItem("mif05.theme"); if (t) document.documentElement.setAttribute("data-theme", t); } catch (e) {}
  </script>
</head>
<body>
  <header class="topbar">
    <div class="wrap">
      <a class="brand" href="#/">
        <span class="logo" aria-hidden="true">
          <i style="background:#8b5cf6"></i><i style="background:#2563eb"></i><i style="background:#059669"></i><i style="background:#d97706"></i><i style="background:#dc2626"></i>
        </span>
        <span>Mif05 Réseaux<small>Révisions CM · QCM</small></span>
      </a>
      <span class="sp"></span>
      <button class="iconbtn" id="themeBtn" aria-label="Changer de thème" title="Thème clair / sombre">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
      </button>
    </div>
  </header>

  <main id="app" class="wrap" aria-live="polite"></main>

  <nav class="nav" aria-label="Navigation principale">
    <div class="wrap">
      <a href="#/" data-tab="home">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>
        Accueil
      </a>
      <a href="#/cours" data-tab="cours">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4.5A1.5 1.5 0 0 1 5.5 3H20v15H5.5A1.5 1.5 0 0 0 4 19.5z"/><path d="M4 19.5A1.5 1.5 0 0 0 5.5 21H20v-3"/><path d="M8 7h8M8 11h6"/></svg>
        Cours
      </a>
      <a href="#/qcm" data-tab="qcm">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="3"/><path d="m8 12 3 3 5-6"/></svg>
        QCM
      </a>
      <a href="#/diapos" data-tab="diapos">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2.5" y="4" width="19" height="13" rx="2"/><path d="M8 21h8M12 17v4"/></svg>
        Diapos
      </a>
    </div>
  </nav>

  <!-- visionneuse de diapos -->
  <div class="viewer" id="viewer" hidden role="dialog" aria-label="Diapositive">
    <div class="v-top">
      <span class="v-title" id="vTitle"></span>
      <a class="v-btn" id="vPdf" target="_blank" rel="noopener">PDF</a>
      <button class="v-btn" id="vZoom" aria-label="Zoom">🔍</button>
      <button class="v-btn" id="vClose" aria-label="Fermer">✕</button>
    </div>
    <div class="v-stage" id="vStage"><img id="vImg" alt=""></div>
    <div class="v-hint" id="vHint">Glisse pour changer de diapo · double-tape pour zoomer · ou tourne ton téléphone</div>
    <div class="v-bot">
      <button class="v-btn" id="vPrev" aria-label="Diapo précédente">‹</button>
      <span class="v-count" id="vCount"></span>
      <button class="v-btn" id="vNext" aria-label="Diapo suivante">›</button>
    </div>
  </div>

  <!-- 1) les données (une ligne par fichier) -->
  <script src="data/cms.js"></script>
  <script src="data/ch1-introduction.js"></script>
  <script src="data/ch2-application.js"></script>
  <script src="data/ch3-transport.js"></script>
  <script src="data/ch4-reseau.js"></script>
  <!-- ajoute ici les prochains chapitres, ex : <script src="data/ch5-liaison.js"></script> -->

  <!-- 2) le moteur du site -->
  <script src="assets/app.js"></script>
</body>
</html>
